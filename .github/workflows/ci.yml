# CI — sanity build on every push to dev.
# Fast feedback before anything is promoted to main.
name: ci

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        run: |
          if (-not (Get-Command rustc -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable --default-host x86_64-pc-windows-msvc
          }

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (release)
        run: cargo build --release

      - name: Check artifacts exist
        run: |
          foreach ($exe in @("dm-service", "dm-ui", "dm-host", "dm-cli")) {
            if (-not (Test-Path "target\release\$exe.exe")) { throw "$exe.exe missing" }
          }
          Write-Host "all 4 binaries built"
